services:
  - type: web
    name: ergo-quant-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRED_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: API_KEY
        sync: false
