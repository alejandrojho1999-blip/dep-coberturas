services:
  - type: web
    name: dep-coberturas
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ERGO_QUANT_API_URL
        fromService:
          type: pserv
          name: ergo-quant-api
          property: hostport
      - key: ERGO_QUANT_API_KEY
        fromService:
          type: pserv
          name: ergo-quant-api
          envVarKey: API_KEY

  - type: pserv
    name: ergo-quant-api
    runtime: python
    rootDir: ergo-quant-api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FRED_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
